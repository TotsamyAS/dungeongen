			<symbol id="icon-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
			<symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
			<symbol id="icon-trash" viewBox="0 0 24 24"><path d="M10 11v6M14 11v6M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
			<symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 9.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
			<symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.985 12.486A9 9 0 1 1 11.514 3.015c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.4Z"/></symbol>
			<symbol id="icon-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6M8 11h6"/></symbol>
			<symbol id="icon-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></symbol>
			<symbol id="icon-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
			<symbol id="icon-wall" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 9v6M16 15v6M16 3v6M3 15h18M3 9h18M8 15v6M8 3v6"/></symbol>

			<symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a7 7 0 0 0-7 7"/></symbol>
			<symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>

			<symbol id="icon-dais" viewBox="0 0 24 24"><path d="M3 19a9 9 0 0 1 18 0M6 19a6 6 0 0 1 12 0M3 19h18"/></symbol>

			<symbol id="icon-rock" viewBox="0 0 24 24"><path d="m4 18 2-9 5-5 7 3 2 10-4 4H8Z"/></symbol>

		</svg>

		<div class="editor-shell">
			<main class="editor-stage">
				<div id="workspaceTabs" class="workspace-tabs" role="tablist" hidden><button id="structureTab" class="workspace-tab active" role="tab" type="button" data-label="structureTab"></button><button id="previewTab" class="workspace-tab" role="tab" type="button" data-label="previewTab"></button></div>
				<div id="canvas" class="editor-canvas" tabindex="0">
					<div id="mapSurface" class="map-surface"><svg id="structureMap" class="map-structure-canvas" aria-hidden="true"></svg><img id="mapImage" class="map-image" alt="" /><img id="mapImageBuffer" class="map-image" alt="" hidden /><svg id="structureOverlay" class="map-structure-overlay" aria-hidden="true"></svg><svg id="editOverlay" class="map-edit-overlay" aria-hidden="true"></svg></div>
				</div>
				<div id="emptyWorkspace" class="workspace-empty">
					<strong data-label="emptyTitle"></strong><span data-label="emptyText"></span>
					<button id="openGeneration" class="ui-button primary" type="button"><svg><use href="#icon-sparkles"/></svg><span data-label="openGeneration"></span></button>
				</div>
				<div id="loading" class="app-image-loading-screen" role="status" aria-live="polite" data-label-aria="loadingScreenAria" hidden>
					<div class="app-image-loading-stage" aria-hidden="true">
						<span class="app-image-loading-spark" style="--spark-index: 0"></span>
						<span class="app-image-loading-spark" style="--spark-index: 1"></span>
						<span class="app-image-loading-spark" style="--spark-index: 2"></span>
						<span class="app-image-loading-spark" style="--spark-index: 3"></span>
						<span class="app-image-loading-spark" style="--spark-index: 4"></span>
						<span class="app-image-loading-spark" style="--spark-index: 5"></span>
						<span class="app-image-loading-spark" style="--spark-index: 6"></span>
						<span class="app-image-loading-spark" style="--spark-index: 7"></span>
						<img src="/dungeon-editor/loadscreen_small.png" alt="" width="240" height="240" decoding="async" />
					</div>
					<div class="app-image-loading-progress-row">
						<progress id="loadingProgress" max="100" value="0" data-label-aria="loadingProgressLabel"></progress>
						<output id="loadingProgressValue">0%</output>
					</div>
					<strong id="loadingLabel" class="app-image-loading-copy" data-label="generating"></strong>
				</div>
				<div class="canvas-controls" role="group" data-label-aria="viewControls">
					<button id="zoomOut" class="canvas-control" type="button"><svg><use href="#icon-zoom-out"/></svg></button>
					<output id="zoomValue">100%</output>
					<button id="fitMap" class="canvas-control" type="button"><svg><use href="#icon-fit"/></svg></button>
					<button id="zoomIn" class="canvas-control" type="button"><svg><use href="#icon-zoom-in"/></svg></button>
				</div>
			</main>

			<nav class="tool-rail" data-label-aria="toolsAria">
				<button class="tool-icon active" data-tool-button="projects" type="button"><svg><use href="#icon-folder"/></svg></button>
				<button class="tool-icon" data-tool-button="generation" type="button"><svg><use href="#icon-sparkles"/></svg></button>
				<button class="tool-icon" data-tool-button="editing" type="button"><svg><use href="#icon-pencil"/></svg></button>
				<button class="tool-icon" data-tool-button="colors" type="button"><svg><use href="#icon-palette"/></svg></button>
				<button class="tool-icon" data-tool-button="export" type="button"><svg><use href="#icon-download"/></svg></button>
				<button class="tool-icon" data-tool-button="settings" type="button"><svg><use href="#icon-settings"/></svg></button>
				<button class="tool-icon" data-tool-button="about" type="button"><svg><use href="#icon-info"/></svg></button>
			</nav>

			<aside class="tool-panel">
				<div id="editorSideFire" class="game-side-fire" aria-hidden="true"></div>
				<header class="session-bar">
					<button id="backButton" class="session-action" type="button"><svg><use href="#icon-arrow-left"/></svg></button>
					<div class="session-title"><strong id="projectTitle"></strong><span id="statusText"></span></div>
					<div class="history-actions" role="group" data-label-aria="historyControls"><button id="undoEdit" class="session-action" type="button" data-tooltip="" aria-label="" aria-keyshortcuts="Control+Z Meta+Z" disabled><svg><use href="#icon-undo"/></svg></button><button id="redoEdit" class="session-action" type="button" data-tooltip="" aria-label="" aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z" disabled><svg><use href="#icon-redo"/></svg></button></div>
					<button id="themeToggle" class="theme-toggle compact" type="button" data-tooltip="" aria-label="" aria-pressed="false"><span class="theme-toggle-orb" aria-hidden="true"><svg class="theme-icon theme-icon-sun"><use href="#icon-sun"/></svg><svg class="theme-icon theme-icon-moon"><use href="#icon-moon"/></svg></span></button>
				</header>

				<div class="tool-panel-scroll">
					<section class="tool-view active" data-tool-panel="projects">
						<h2 data-label="projectsTitle"></h2>
						<div id="storageMeter" class="storage-meter" hidden>
							<div><strong id="storageUsed"></strong><span id="storageAvailable"></span></div>
							<div class="storage-progress" role="progressbar"><span></span></div>
						</div>
						<form id="createProjectForm" class="create-row">
							<input id="newProjectName" maxlength="128" data-label-placeholder="newProjectPlaceholder" />
							<button class="ui-button primary icon-only" type="submit"><svg><use href="#icon-plus"/></svg></button>
						</form>
						<div id="projectList" class="project-list"></div>
					</section>

					<section class="tool-view" data-tool-panel="generation">
						<h2 data-label="generationTitle"></h2>
						<label class="field"><span data-label="size"></span><select id="size" class="app-select-native" hidden><option value="tiny" data-label="sizeTiny"></option><option value="small" data-label="sizeSmall"></option><option value="medium" data-label="sizeMedium"></option><option value="large" data-label="sizeLarge"></option><option value="xlarge" data-label="sizeXlarge"></option></select></label>
						<label class="field"><span data-label="symmetry"></span><select id="symmetry" class="app-select-native" hidden><option value="none" data-label="symmetryNone"></option><option value="bilateral" data-label="symmetryBilateral"></option></select></label>
						<label class="field"><span data-label="connections"></span><select id="cross" class="app-select-native" hidden><option value="none" data-label="none"></option><option value="low" data-label="low"></option><option value="med" data-label="medium"></option><option value="high" data-label="high"></option></select></label>
						<label class="field"><span data-label="density"></span><select id="pack" class="app-select-native" hidden><option value="sparse" data-label="sparse"></option><option value="normal" data-label="normal"></option><option value="tight" data-label="tight"></option></select></label>
						<label class="field"><span data-label="roomSize"></span><select id="roomSize" class="app-select-native" hidden><option value="cozy" data-label="cozy"></option><option value="mixed" data-label="mixed"></option><option value="grand" data-label="grand"></option></select></label>
						<label class="field"><span data-label="water"></span><select id="water" class="app-select-native" hidden><option value="dry" data-label="dry"></option><option value="puddles" data-label="puddles"></option><option value="pools" data-label="pools"></option><option value="lakes" data-label="lakes"></option><option value="flooded" data-label="flooded"></option></select></label>
						<label class="field"><span data-label="seed"></span><input id="seed" maxlength="128" data-label-placeholder="randomSeed" /></label>
						<label class="check"><input id="roundRooms" type="checkbox"/><span data-label="roundRooms"></span></label>
						<label class="check"><input id="halls" type="checkbox" checked/><span data-label="halls"></span></label>
						<label class="check"><input id="showNumbers" type="checkbox" checked/><span data-label="showNumbers"></span></label>
						<button id="generateButton" class="ui-button primary full-width" type="button" data-label="generate"></button>
					</section>

					<section class="tool-view edit-tool-help" data-tool-panel="editing">
						<h2 data-label="editingTitle"></h2>
						<h3 class="tool-group-title" data-label="structureTools"></h3>
						<div class="edit-tool-grid" role="group" data-label-aria="editingToolsAria">
							<button class="edit-tool-tile active" data-edit-tool="wall" type="button" aria-pressed="true"><svg><use href="#icon-wall"/></svg><strong class="edit-tool-label" data-label="toolWall"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="corridor" type="button" aria-pressed="false"><svg><use href="#icon-route"/></svg><strong class="edit-tool-label" data-label="toolCorridor"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="roundRoom" type="button" aria-pressed="false"><svg><use href="#icon-circle"/></svg><strong class="edit-tool-label" data-label="toolRoundRoom"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="roomClass" type="button" aria-pressed="false"><svg><use href="#icon-room-class"/></svg><strong class="edit-tool-label" data-label="toolRoomClass"></strong></button>
						</div>
						<h3 class="tool-group-title" data-label="objectTools"></h3>
						<div class="edit-tool-grid object-tool-grid" role="group" data-label-aria="objectToolsAria">
							<button class="edit-tool-tile" data-edit-tool="coffin" type="button"><svg><use href="#icon-coffin"/></svg><strong class="edit-tool-label" data-label="toolCoffin"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="dais" type="button"><svg><use href="#icon-dais"/></svg><strong class="edit-tool-label" data-label="toolDais"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="altar" type="button"><svg><use href="#icon-altar"/></svg><strong class="edit-tool-label" data-label="toolAltar"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="fountain" type="button"><svg><use href="#icon-fountain"/></svg><strong class="edit-tool-label" data-label="toolFountain"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="column_round" type="button"><svg><use href="#icon-column"/></svg><strong class="edit-tool-label" data-label="toolColumnRound"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="column_square" type="button"><svg><use href="#icon-column"/></svg><strong class="edit-tool-label" data-label="toolColumnSquare"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="rock_small" type="button"><svg><use href="#icon-rock"/></svg><strong class="edit-tool-label" data-label="toolRockSmall"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="rock_medium" type="button"><svg><use href="#icon-rock"/></svg><strong class="edit-tool-label" data-label="toolRockMedium"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="rock_large" type="button"><svg><use href="#icon-rock"/></svg><strong class="edit-tool-label" data-label="toolRockLarge"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="stairs_up" type="button"><svg><use href="#icon-stairs"/></svg><strong class="edit-tool-label" data-label="toolStairsUp"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="stairs_down" type="button"><svg><use href="#icon-stairs"/></svg><strong class="edit-tool-label" data-label="toolStairsDown"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="entrance" type="button"><svg><use href="#icon-exit"/></svg><strong class="edit-tool-label" data-label="toolEntrance"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="exit" type="button"><svg><use href="#icon-exit"/></svg><strong class="edit-tool-label" data-label="toolExit"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="door_open" type="button"><svg><use href="#icon-door"/></svg><strong class="edit-tool-label" data-label="toolDoorOpen"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="door_closed" type="button"><svg><use href="#icon-door"/></svg><strong class="edit-tool-label" data-label="toolDoorClosed"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="door_locked" type="button"><svg><use href="#icon-door"/></svg><strong class="edit-tool-label" data-label="toolDoorLocked"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="door_secret" type="button"><svg><use href="#icon-door"/></svg><strong class="edit-tool-label" data-label="toolDoorSecret"></strong></button>
							<button class="edit-tool-tile" data-edit-tool="waterBrush" type="button"><svg><use href="#icon-water"/></svg><strong class="edit-tool-label" data-label="toolWater"></strong></button>
							<button class="edit-tool-tile danger" data-edit-tool="eraser" type="button"><svg><use href="#icon-eraser"/></svg><strong class="edit-tool-label" data-label="toolEraser"></strong></button>
						</div>
						<div class="edit-tool-details"><strong id="editToolTitle"></strong><p id="editToolHint" class="muted"></p><p id="editAreaShortcut" class="edit-shortcut"></p></div>
					</section>

					<section class="tool-view" data-tool-panel="colors">
						<h2 data-label="colorsTitle"></h2>
						<p class="muted" data-label="colorsHint"></p>
						<div class="palette-selector">
							<span class="palette-selector-label" data-label="palettePreset"></span>
							<button id="palettePresetButton" class="palette-select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
								<span id="palettePresetPreview" class="palette-preview" aria-hidden="true"></span>
								<strong id="palettePresetName"></strong>
								<svg aria-hidden="true"><use href="#icon-chevron-down"/></svg>
							</button>
							<div id="palettePresetMenu" class="palette-menu" role="listbox" hidden></div>
						</div>
						<div class="palette-editor">
							<label class="palette-name-field"><span data-label="paletteName"></span><input id="paletteName" maxlength="128" data-label-placeholder="paletteNamePlaceholder" /></label>
							<div class="palette-actions">
								<button id="paletteSave" class="ui-button primary" type="button"><svg><use href="#icon-save"/></svg><span id="paletteSaveText"></span></button>
								<button id="paletteDelete" class="ui-button danger" type="button" hidden><svg><use href="#icon-trash"/></svg><span data-label="paletteDeleteTheme"></span></button>
							</div>
							<p id="paletteStatus" class="palette-status" role="status" aria-live="polite"></p>
						</div>
						<div class="color-list">
							<label class="color-field"><span data-label="colorBackground"></span><input id="colorBackground" type="color" /></label>
							<label class="color-field"><span data-label="colorFloor"></span><input id="colorFloor" type="color" /></label>
							<label class="color-field"><span data-label="colorWalls"></span><input id="colorWalls" type="color" /></label>
							<label class="color-field"><span data-label="colorHatching"></span><input id="colorHatching" type="color" /></label>
							<label class="color-field"><span data-label="colorShading"></span><input id="colorShading" type="color" /></label>
							<label class="color-field"><span data-label="colorShadow"></span><input id="colorShadow" type="color" /></label>
							<label class="color-field"><span data-label="colorGrid"></span><input id="colorGrid" type="color" /></label>
							<label class="color-field"><span data-label="colorWater"></span><input id="colorWater" type="color" /></label>
							<label class="color-field"><span data-label="colorNumbers"></span><input id="colorNumbers" type="color" /></label>
						</div>
						<div id="stats" class="stats-grid"></div>
					</section>

					<section class="tool-view" data-tool-panel="export">
						<h2 data-label="exportTitle"></h2>
						<p class="muted" data-label="exportHint"></p>
						<button id="exportButton" class="ui-button primary full-width" type="button"><svg><use href="#icon-download"/></svg><span data-label="exportJpg"></span></button>
					</section>

					<section class="tool-view" data-tool-panel="settings">
						<h2 data-label="settingsTitle"></h2>
						<label class="setting-card"><span><strong data-label="fastMode"></strong><small data-label="fastModeHint"></small></span><input id="fastMode" type="checkbox" /></label>
					</section>

					<section class="tool-view" data-tool-panel="about">
						<h2 data-label="aboutTitle"></h2>
						<p data-label="aboutText"></p>
						<p class="muted" data-label="futureEditing"></p>
						<a id="sourceLink" class="ui-button full-width" target="_blank" rel="noreferrer" data-label="sourceCode"></a>
						<a class="ui-button full-width" href="https://github.com/benjcooley/dungeongen" target="_blank" rel="noreferrer" data-label="upstreamSourceCode"></a>
					</section>
				</div>
			</aside>
		</div>

		<div id="appToast" class="app-toast success" role="status" aria-live="polite" hidden>
			<span></span>
		</div>

		<dialog id="renameProjectDialog" class="editor-dialog confirm-dialog">
			<form id="renameProjectForm" class="dialog-card">
				<header>
					<h2 data-label="renameProjectTitle"></h2>
					<button class="dialog-close" type="button" data-rename-close data-label-aria="close" aria-label="">×</button>
				</header>
				<label class="field">
					<span data-label="projectName"></span>
					<input id="renameProjectName" type="text" maxlength="128" required />
				</label>
				<div class="modal-actions">
					<button class="ui-button" type="button" data-rename-close data-label="cancel"></button>
					<button class="ui-button primary" type="submit" data-label="renameProjectConfirm"></button>
				</div>
			</form>
		</dialog>

		<script src="/dungeon-editor/editor.js?v=20260801-17" defer></script>
	</body>
</html>
